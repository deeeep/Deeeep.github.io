<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Masking</title>
  <desc id="desc">TET talent identity mark</desc>
  <defs>
    <linearGradient id="surface" gradientUnits="userSpaceOnUse" x1="12" y1="4" x2="97" y2="110">
      <stop offset="0" stop-color="#a1849d"></stop>
      <stop offset="0.48" stop-color="#70446b"></stop>
      <stop offset="1" stop-color="#553451"></stop>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="27" cy="15" r="64">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".36"></stop>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#fff0b8"></stop>
      <stop offset=".48" stop-color="#efc56f"></stop>
      <stop offset="1" stop-color="#dda136"></stop>
    </linearGradient>
    <linearGradient id="warmLine" gradientUnits="userSpaceOnUse" x1="34" y1="41" x2="82" y2="66.5">
      <stop offset="0" stop-color="#fff0b8"></stop>
      <stop offset=".48" stop-color="#efc56f"></stop>
      <stop offset="1" stop-color="#dda136"></stop>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#160d08" flood-opacity=".26"></feDropShadow>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <clipPath id="clip"><path d="M 24 2 H 68 Q 108 2 108 42 V 86 Q 108 108 86 108 H 50 Q 2 108 2 60 V 24 Q 2 2 24 2 Z"></path></clipPath>
  </defs>
  <path d="M 24 2 H 68 Q 108 2 108 42 V 86 Q 108 108 86 108 H 50 Q 2 108 2 60 V 24 Q 2 2 24 2 Z" fill="url(#surface)"></path>
  <path d="M 24 2 H 68 Q 108 2 108 42 V 86 Q 108 108 86 108 H 50 Q 2 108 2 60 V 24 Q 2 2 24 2 Z" fill="url(#light)"></path>
  <g clip-path="url(#clip)"><path d="M0 82 C25 69 76 113 114 77 L114 114 L0 114Z" fill="#000" opacity=".08"></path></g>
  <path d="M 24 9 H 68 Q 101 9 101 42 V 86 Q 101 101 86 101 H 50 Q 9 101 9 60 V 24 Q 9 9 24 9 Z" fill="none" stroke="#fffaf0" stroke-opacity=".34" stroke-width="1"></path>
  <g filter="url(#shadow)"><g fill="#fff" fill-opacity=".1" stroke="#fffaf0" stroke-width="3">
    <rect x="17" y="27" width="43" height="58" rx="21" transform="rotate(-15 38.5 56)" opacity=".46"></rect>
    <rect x="34" y="26" width="43" height="58" rx="21" transform="rotate(1 55.5 55)" opacity=".68"></rect>
    <rect x="51" y="24" width="43" height="58" rx="21" transform="rotate(14 72.5 53)" opacity=".94"></rect>
    <rect x="49" y="36" width="13" height="42" rx="6.5" fill="url(#warm)" fill-opacity="1" stroke="none" filter="url(#glow)"></rect>
  </g></g>
</svg>