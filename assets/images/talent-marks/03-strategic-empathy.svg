<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" role="img" aria-labelledby="title desc">
  <title id="title">Strategic Empathy</title>
  <desc id="desc">TET talent identity mark</desc>
  <defs>
    <linearGradient id="surface" gradientUnits="userSpaceOnUse" x1="12" y1="4" x2="97" y2="110">
      <stop offset="0" stop-color="#9c7a8d"></stop>
      <stop offset="0.48" stop-color="#693653"></stop>
      <stop offset="1" stop-color="#50293f"></stop>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="27" cy="15" r="64">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".36"></stop>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
