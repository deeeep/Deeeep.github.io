  <g clip-path="url(#clip)"><path d="M0 82 C25 69 76 113 114 77 L114 114 L0 114Z" fill="#000" opacity=".08"></path></g>
  <path d="M 28 9 H 54 Q 101 9 101 56 V 82 Q 101 101 82 101 H 28 Q 9 101 9 82 V 28 Q 9 9 28 9 Z" fill="none" stroke="#fffaf0" stroke-opacity=".34" stroke-width="1"></path>
