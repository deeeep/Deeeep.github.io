<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" role="img" aria-labelledby="title desc">
  <title id="title">Deep Focus</title>
  <desc id="desc">TET talent identity mark</desc>
  <defs>
    <linearGradient id="surface" gradientUnits="userSpaceOnUse" x1="12" y1="4" x2="97" y2="110">
      <stop offset="0" stop-color="#6c7586"></stop>
      <stop offset="0.48" stop-color="#202e48"></stop>
      <stop offset="1" stop-color="#182337"></stop>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="27" cy="15" r="64">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".36"></stop>
      <stop offset=".7" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#fff0b8"></stop>
      <stop offset=".48" stop-color="#efc56f"></stop>
      <stop offset="1" stop-color="#dda136"></stop>
    </linearGradient>
    <linearGradient id="warmLine" gradientUnits="userSpaceOnUse" x1="34" y1="41" x2="82" y2="66.5">
      <stop offset="0" stop-color="#fff0b8"></stop>
      <stop offset=".48" stop-color="#efc56f"></stop>
      <stop offset="1" stop-color="#dda136"></stop>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#160d08" flood-opacity=".26"></feDropShadow>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <clipPath id="clip"><path d="M 24 2 H 58 Q 108 2 108 52 V 86 Q 108 108 86 108 H 52 Q 2 108 2 58 V 24 Q 2 2 24 2 Z"></path></clipPath>
  </defs>
  <path d="M 24 2 H 58 Q 108 2 108 52 V 86 Q 108 108 86 108 H 52 Q 2 108 2 58 V 24 Q 2 2 24 2 Z" fill="url(#surface)"></path>
  <path d="M 24 2 H 58 Q 108 2 108 52 V 86 Q 108 108 86 108 H 52 Q 2 108 2 58 V 24 Q 2 2 24 2 Z" fill="url(#light)"></path>
  <g clip-path="url(#clip)"><path d="M0 82 C25 69 76 113 114 77 L114 114 L0 114Z" fill="#000" opacity=".08"></path></g>
  <path d="M 24 9 H 58 Q 101 9 101 52 V 86 Q 101 101 86 101 H 52 Q 9 101 9 58 V 24 Q 9 9 24 9 Z" fill="none" stroke="#fffaf0" stroke-opacity=".34" stroke-width="1"></path>
  <g filter="url(#shadow)"><g fill="none" stroke="#fffaf0" stroke-width="3">
    <ellipse cx="52" cy="56" rx="38" ry="38" transform="rotate(-12 52 56)" opacity=".42"></ellipse>
    <ellipse cx="57" cy="53" rx="27" ry="27" transform="rotate(-12 57 53)" opacity=".64"></ellipse>
    <ellipse cx="62" cy="50" rx="16" ry="16" opacity=".9"></ellipse>
    <path d="M20 76 L86 32" stroke-linecap="round" opacity=".52"></path>
    <circle cx="62" cy="50" r="7" fill="url(#warm)" stroke="none" filter="url(#glow)"></circle>
  </g></g>
</svg>